# YINILOW2 Render Blueprint
# Static React/Vite storefront plus Vert.x API backed by managed PostgreSQL.

databases:
  - name: yinilow2-db
    plan: free
    databaseName: yinilow
    user: yinilow

services:
  - type: web
    name: yinilow2-api
    runtime: docker
    repo: https://github.com/Superrepus8080/YINILOW2
    branch: main
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # The API auto-detects DATABASE_URL and runs on Postgres (durable catalog,
      # holds, orders, and payments with DB-enforced one-off/idempotency
      # constraints). Without it, it falls back to in-memory mode.
      - key: DATABASE_URL
        fromDatabase:
          name: yinilow2-db
          property: connectionString

  - type: web
    name: yinilow2
    runtime: static
    repo: https://github.com/Superrepus8080/YINILOW2
    branch: main
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist/client
    envVars:
      - key: VITE_YINILOW_API_BASE
        value: https://yinilow2-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
